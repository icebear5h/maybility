[pytest]
# Pytest configuration
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
# Note: Install pytest-asyncio to enable: pip install pytest-asyncio
# asyncio_mode = auto

# Coverage configuration
# Note: Install pytest-cov to enable coverage: pip install pytest-cov
addopts =
    --verbose
    -ra

# Markers for test organization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    eval: AI agent evaluation tests (LangSmith)
    slow: Slow tests (>1 second)
    agent: Agent-specific tests

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv __pycache__

# Log level
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Fail on warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
